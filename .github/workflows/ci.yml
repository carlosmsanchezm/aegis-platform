name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Sync Go workspace
        run: go work sync

      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          setup-envtest use --bin-dir $(pwd)/bin/k8s
          echo "KUBEBUILDER_ASSETS=$(pwd)/bin/k8s/$(ls $(pwd)/bin/k8s)" >> $GITHUB_ENV

      - name: Run tests
        run: |
          set -euo pipefail
          # Test k8s-agent (requires envtest) - exclude e2e tests that need Kind cluster
          (cd agents/k8s-agent && go test $(go list ./... | grep -v /test/e2e) -v)

          # Test other modules
          for module in pkg/workspace services/platform-api services/proxy; do
            echo "Testing $module"
            (cd "$module" && go test ./... -v)
          done

      - name: Build binaries
        run: |
          set -euo pipefail
          (cd services/platform-api && go build -o /dev/null ./...)
          (cd services/proxy && go build -o /dev/null ./...)
          (cd agents/k8s-agent && go build -o /dev/null ./...)

      - name: Go vet
        run: |
          set -euo pipefail
          for module in agents/k8s-agent pkg/workspace services/platform-api services/proxy; do
            echo "Vetting $module"
            (cd "$module" && go vet ./...)
          done
