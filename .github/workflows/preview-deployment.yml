name: Build, Test, and Deploy Preview

on:
  pull_request:

env:
  AWS_REGION: us-east-1
  PREVIEW_NAMESPACE: preview-${{ github.event.number }}
  PREVIEW_RELEASE: preview-${{ github.event.number }}
# Requires repository secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lint-and-unit-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go unit & integration tests
        run: |
          set -euo pipefail
          go work sync

          echo "Running make test in agents/k8s-agent"
          (cd agents/k8s-agent && make test)

          for module in pkg/workspace services/platform-api services/proxy; do
            echo "Running go test in $module"
            (cd "$module" && go test ./...)
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: aegis-platform/yarn.lock

      - name: Install frontend dependencies
        run: |
          cd aegis-platform
          yarn install --immutable

      - name: Run frontend unit tests
        run: |
          cd aegis-platform
          yarn test --watchAll=false

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    permissions:
      contents: read
    outputs:
      platform_api_image: ${{ steps.build.outputs.platform_api_image }}
      proxy_image: ${{ steps.build.outputs.proxy_image }}
      k8s_agent_image: ${{ steps.build.outputs.k8s_agent_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push images
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          PLATFORM_IMAGE="${ECR_REGISTRY}/aegis/platform-api:${IMAGE_TAG}"
          PROXY_IMAGE="${ECR_REGISTRY}/aegis/proxy:${IMAGE_TAG}"
          K8S_AGENT_IMAGE="${ECR_REGISTRY}/aegis/k8s-agent:${IMAGE_TAG}"

          docker build -t "${PLATFORM_IMAGE}" -f services/platform-api/Dockerfile .
          docker build -t "${PROXY_IMAGE}" -f services/proxy/Dockerfile .
          docker build -t "${K8S_AGENT_IMAGE}" -f agents/k8s-agent/Dockerfile .

          docker push "${PLATFORM_IMAGE}"
          docker push "${PROXY_IMAGE}"
          docker push "${K8S_AGENT_IMAGE}"

          echo "platform_api_image=${PLATFORM_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "proxy_image=${PROXY_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "k8s_agent_image=${K8S_AGENT_IMAGE}" >> "$GITHUB_OUTPUT"

  deploy-preview-and-test:
    name: Deploy Preview & Run E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    outputs:
      preview_host: ${{ steps.deploy.outputs.preview_host }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform init & apply
        env:
          TF_WORKSPACE: preview-${{ github.event.number }}
        run: |
          set -euo pipefail
          cd terraform
          terraform init -backend-config=backend.hcl
          TF_WS="$TF_WORKSPACE"
          unset TF_WORKSPACE
          terraform workspace select "$TF_WS" || terraform workspace new "$TF_WS"
          terraform apply -auto-approve

      - name: Deploy control plane via Helm
        id: deploy
        env:
          PLATFORM_API_IMAGE_TAG: ${{ needs.build-and-push.outputs.platform_api_image }}
          PROXY_IMAGE_TAG: ${{ needs.build-and-push.outputs.proxy_image }}
          K8S_AGENT_IMAGE_TAG: ${{ needs.build-and-push.outputs.k8s_agent_image }}
          HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}
          K8S_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          SPOKE_HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}-spoke
          SKIP_ROUTE53_UPDATE: '1'
        run: |
          set -euo pipefail
          ./terraform/generate-helm-values.sh --non-interactive --tls

          cd terraform
          API_HOST=$(terraform output -raw dns_platform_api_grpc)
          PROXY_HOST=$(terraform output -raw dns_proxy)
          API_HOST=${API_HOST%.}
          PROXY_HOST=${PROXY_HOST%.}
          echo "preview_host=${API_HOST}" >> "$GITHUB_OUTPUT"
          echo "preview_proxy=${PROXY_HOST}" >> "$GITHUB_OUTPUT"
          echo "grpc_ca=${HOME}/aegis-platform-api-ca.crt" >> "$GITHUB_OUTPUT"

      - name: Install test tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run platform API E2E tests
        env:
          AEGIS_GRPC_ADDR: ${{ steps.deploy.outputs.preview_host }}:8081
          GRPC_TLS: '1'
          GRPC_CA: ${{ steps.deploy.outputs.grpc_ca }}
          AEGIS_WORKLOAD_NAMESPACE: aegis-workloads
        run: |
          scripts/e2e-platform-api.sh

      - name: Create Kind cluster for operator tests
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: aegis-e2e

      - name: Run k8s-agent E2E tests
        env:
          USE_EXISTING_CLUSTER: 'true'
        run: |
          cd agents/k8s-agent
          make test-e2e

  teardown-preview:
    name: Teardown Preview Environment
    if: always()
    runs-on: ubuntu-latest
    needs: deploy-preview-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform destroy
        env:
          TF_WORKSPACE: preview-${{ github.event.number }}
          PREVIEW_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          PREVIEW_RELEASE: ${{ env.PREVIEW_RELEASE }}
          SPOKE_HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}-spoke
        run: |
          set -euo pipefail
          cd terraform
          terraform init -backend-config=backend.hcl
          TF_WS="$TF_WORKSPACE"
          unset TF_WORKSPACE
          if terraform workspace list | grep -q "$TF_WS"; then
            terraform workspace select "$TF_WS"
            KUBECTL_CMD=$(terraform output -raw kubectl_config_command || true)
            if [ -n "$KUBECTL_CMD" ]; then
              eval "$KUBECTL_CMD"
              helm uninstall "$PREVIEW_RELEASE" --namespace "$PREVIEW_NAMESPACE" || true
              helm uninstall "$SPOKE_HELM_RELEASE" --namespace "$PREVIEW_NAMESPACE" || true
              kubectl delete namespace "$PREVIEW_NAMESPACE" --ignore-not-found || true
            fi
            terraform destroy -auto-approve || echo "Terraform destroy failed; manual cleanup may be required"
            terraform workspace select default
            terraform workspace delete "$TF_WS" || true
          else
            echo "Workspace $TF_WS not found; skipping destroy"
          fi
