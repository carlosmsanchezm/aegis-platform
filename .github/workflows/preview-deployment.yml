name: Build, Test, and Deploy Preview

on:
  workflow_dispatch:
    inputs:
      run_subset:
        description: "Select which portion of the workflow to run"
        type: choice
        default: all
        options:
          - all
          - deploy
          - deploy-no-teardown
      preview_number:
        description: "Preview identifier (defaults to PR number or workflow run id)"
        required: false

env:
  AWS_REGION: us-east-1
  PREVIEW_ID: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.preview_number != '' && github.event.inputs.preview_number || github.run_id) || github.event.number }}
  PREVIEW_NAMESPACE: preview-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.preview_number != '' && github.event.inputs.preview_number || github.run_id) || github.event.number }}
  PREVIEW_RELEASE: preview-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.preview_number != '' && github.event.inputs.preview_number || github.run_id) || github.event.number }}
  RUN_SUBSET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_subset || 'all' }}
# Requires repository secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-unit-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skipping lint/unit for deploy-only run
        if: ${{ env.RUN_SUBSET != 'all' }}
        run: echo "RUN_SUBSET=${RUN_SUBSET}; skipping lint and unit tests."

      - name: Checkout code
        if: ${{ env.RUN_SUBSET == 'all' }}
        uses: actions/checkout@v4

      - name: Set up Go
        if: ${{ env.RUN_SUBSET == 'all' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go unit & integration tests
        if: ${{ env.RUN_SUBSET == 'all' }}
        run: |
          set -euo pipefail
          go work sync

          echo "Running make test in agents/k8s-agent"
          (cd agents/k8s-agent && make test)

          for module in pkg/workspace services/platform-api services/proxy; do
            echo "Running go test in $module"
            (cd "$module" && go test ./...)
          done

      - name: Set up Node.js
        if: ${{ env.RUN_SUBSET == 'all' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: aegis-platform/yarn.lock

      - name: Install frontend dependencies
        if: ${{ env.RUN_SUBSET == 'all' }}
        run: |
          cd aegis-platform
          yarn install --immutable

      - name: Run frontend unit tests
        if: ${{ env.RUN_SUBSET == 'all' }}
        run: |
          cd aegis-platform
          yarn test --watchAll=false

  build-and-push:
    name: Build & Push Images
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_subset == '' || github.event.inputs.run_subset == 'all' || github.event.inputs.run_subset == 'deploy' || github.event.inputs.run_subset == 'deploy-no-teardown' }}
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    permissions:
      contents: read
    outputs:
      platform_api_image: ${{ steps.image-data.outputs.platform_api_image }}
      proxy_image: ${{ steps.image-data.outputs.proxy_image }}
      k8s_agent_image: ${{ steps.image-data.outputs.k8s_agent_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_subset == '' || github.event.inputs.run_subset == 'all' }}
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tags
        id: image-data
        run: |
          set -euo pipefail
          ECR_REGISTRY='${{ steps.login-ecr.outputs.registry }}'
          IMAGE_TAG='${{ github.sha }}'
          echo "platform_api_image=${ECR_REGISTRY}/aegis/platform-api:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "proxy_image=${ECR_REGISTRY}/aegis/proxy:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "k8s_agent_image=${ECR_REGISTRY}/aegis/k8s-agent:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push images
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_subset == '' || github.event.inputs.run_subset == 'all' }}
        env:
          PLATFORM_IMAGE: ${{ steps.image-data.outputs.platform_api_image }}
          PROXY_IMAGE: ${{ steps.image-data.outputs.proxy_image }}
          K8S_AGENT_IMAGE: ${{ steps.image-data.outputs.k8s_agent_image }}
        run: |
          set -euo pipefail
          docker build -t "${PLATFORM_IMAGE}" -f services/platform-api/Dockerfile .
          docker build -t "${PROXY_IMAGE}" -f services/proxy/Dockerfile .
          docker build -t "${K8S_AGENT_IMAGE}" -f agents/k8s-agent/Dockerfile .

          docker push "${PLATFORM_IMAGE}"
          docker push "${PROXY_IMAGE}"
          docker push "${K8S_AGENT_IMAGE}"

  deploy-preview-and-test:
    name: Deploy Preview & Run E2E Tests
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_subset == '' || github.event.inputs.run_subset == 'all' || github.event.inputs.run_subset == 'deploy' || github.event.inputs.run_subset == 'deploy-no-teardown' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    outputs:
      preview_host: ${{ steps.deploy.outputs.preview_host }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform init & apply
        env:
          TF_WORKSPACE: preview-${{ env.PREVIEW_ID }}
        run: |
          set -euo pipefail
          cd terraform
          terraform init -backend-config=backend.hcl
          TF_WS="$TF_WORKSPACE"
          unset TF_WORKSPACE
          terraform workspace select "$TF_WS" || terraform workspace new "$TF_WS"
          terraform apply -auto-approve

      - name: Deploy control plane via Helm
        id: deploy
        env:
          PLATFORM_API_IMAGE_TAG: ${{ needs.build-and-push.outputs.platform_api_image }}
          PROXY_IMAGE_TAG: ${{ needs.build-and-push.outputs.proxy_image }}
          K8S_AGENT_IMAGE_TAG: ${{ needs.build-and-push.outputs.k8s_agent_image }}
          HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}
          K8S_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          SPOKE_HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}-spoke
          SKIP_ROUTE53_UPDATE: '1'
        run: |
          set -euo pipefail

          # First, deploy with the helm script (which skips Route53 update)
          ./terraform/generate-helm-values.sh --non-interactive --tls

      - name: Update Route53 and configure E2E endpoints
        id: configure-e2e
        env:
          HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}
          K8S_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
        run: |
          set -euo pipefail

          # Extract actual LoadBalancer hostnames from Kubernetes services
          echo "⏳ Waiting for LoadBalancers to be provisioned..."

          # Wait for platform-api LoadBalancer (max 5 minutes)
          for i in {1..60}; do
            PLATFORM_LB=$(kubectl get svc "${HELM_RELEASE}-platform-api" -n "${K8S_NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${PLATFORM_LB}" ]; then
              echo "✅ Platform API LoadBalancer ready: ${PLATFORM_LB}"
              break
            fi
            echo "  Waiting for platform-api LoadBalancer... (${i}/60)"
            sleep 5
          done

          # Wait for proxy LoadBalancer (max 5 minutes)
          for i in {1..60}; do
            PROXY_LB=$(kubectl get svc "${HELM_RELEASE}-proxy" -n "${K8S_NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${PROXY_LB}" ]; then
              echo "✅ Proxy LoadBalancer ready: ${PROXY_LB}"
              break
            fi
            echo "  Waiting for proxy LoadBalancer... (${i}/60)"
            sleep 5
          done

          # Verify LoadBalancers were obtained
          if [ -z "${PLATFORM_LB}" ] || [ -z "${PROXY_LB}" ]; then
            echo "❌ Failed to get LoadBalancer hostnames after 5 minutes"
            exit 1
          fi

          # Update Route53 DNS records with actual LoadBalancer hostnames
          echo ""
          echo "🌐 Updating Route53 DNS records..."
          cd terraform
          terraform apply -auto-approve \
            -var="platform_api_lb_hostname=${PLATFORM_LB}" \
            -var="proxy_lb_hostname=${PROXY_LB}" \
            -target=aws_route53_record.platform_api_grpc \
            -target=aws_route53_record.platform_api_http \
            -target=aws_route53_record.proxy

          # Get the DNS names from Terraform outputs (now updated)
          PLATFORM_DNS=$(terraform output -raw dns_platform_api_grpc 2>/dev/null || echo "")
          PROXY_DNS=$(terraform output -raw dns_proxy 2>/dev/null || echo "")

          # Remove trailing dots from DNS names if present
          PLATFORM_DNS=${PLATFORM_DNS%.}
          PROXY_DNS=${PROXY_DNS%.}

          echo "✅ Route53 records updated:"
          echo "   ${PLATFORM_DNS} → ${PLATFORM_LB}"
          echo "   ${PROXY_DNS} → ${PROXY_LB}"

          # Wait for DNS propagation (30 seconds should be enough for Route53)
          echo ""
          echo "⏳ Waiting 30s for DNS propagation..."
          sleep 30

          # Verify DNS resolution
          echo "🔍 Verifying DNS resolution..."
          if dig +short "${PLATFORM_DNS}" | grep -q '^[0-9]'; then
            echo "✅ ${PLATFORM_DNS} resolves to: $(dig +short ${PLATFORM_DNS} | head -1)"
          else
            echo "⚠️  ${PLATFORM_DNS} not yet resolved, but continuing..."
          fi

          # Output DNS names for E2E tests (use DNS, not LoadBalancer directly)
          echo "grpc_addr=${PLATFORM_DNS}:8081" >> "$GITHUB_OUTPUT"
          echo "proxy_hostname=${PROXY_DNS}" >> "$GITHUB_OUTPUT"
          echo "grpc_ca=${HOME}/aegis-platform-api-ca.crt" >> "$GITHUB_OUTPUT"

          echo ""
          echo "📋 E2E Test Endpoints (via DNS):"
          echo "   Platform API gRPC: ${PLATFORM_DNS}:8081"
          echo "   Proxy:             ${PROXY_DNS}:8080"
          echo "   CA Bundle:         ${HOME}/aegis-platform-api-ca.crt"

      - name: Install test tooling
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          sudo apt-get update
          sudo apt-get install -y jq
          GRPCURL_VERSION=1.9.3
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64)
              GRPCURL_PACKAGE_ARCH=linux_x86_64
              ;;
            arm64|aarch64)
              GRPCURL_PACKAGE_ARCH=linux_arm64
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac
          TMPDIR=$(mktemp -d)
          ASSET="grpcurl_${GRPCURL_VERSION}_${GRPCURL_PACKAGE_ARCH}.tar.gz"
          CURL_URL="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/${ASSET}"
          if ! curl -fsSL "$CURL_URL" -o "$TMPDIR/$ASSET"; then
            echo "Failed to download grpcurl from $CURL_URL" >&2
            exit 1
          fi
          tar -xzf "$TMPDIR/$ASSET" -C "$TMPDIR" grpcurl
          sudo install "$TMPDIR/grpcurl" /usr/local/bin/grpcurl
          rm -rf "$TMPDIR"

      - name: Run platform API E2E tests
        env:
          AEGIS_GRPC_ADDR: ${{ steps.configure-e2e.outputs.grpc_addr }}
          AEGIS_PROXY_HOSTNAME: ${{ steps.configure-e2e.outputs.proxy_hostname }}
          GRPC_TLS: '1'
          GRPC_CA: ${{ steps.configure-e2e.outputs.grpc_ca }}
          AEGIS_WORKLOAD_NAMESPACE: aegis-workloads
          AEGIS_PLATFORM_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          AEGIS_PLATFORM_SERVICE: ${{ env.PREVIEW_RELEASE }}-platform-api
          AEGIS_PLATFORM_DEPLOYMENT: ${{ env.PREVIEW_RELEASE }}-platform-api
        run: |
          set -euo pipefail
          echo "🧪 Running E2E tests against preview environment (via DNS):"
          echo "   gRPC Address: ${AEGIS_GRPC_ADDR}"
          echo "   Proxy:        ${AEGIS_PROXY_HOSTNAME}"
          echo "   Namespace:    ${AEGIS_PLATFORM_NAMESPACE}"
          echo "   CA Bundle:    ${GRPC_CA}"
          echo "   TLS:          Enabled"
          echo ""

          SCRIPT_ROOT="${{ github.workspace }}"
          bash "${SCRIPT_ROOT}/scripts/e2e-platform-api.sh"

      - name: Create Kind cluster for operator tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_subset == '' || github.event.inputs.run_subset == 'all' }}
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: aegis-e2e

      - name: Run k8s-agent E2E tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_subset == '' || github.event.inputs.run_subset == 'all' }}
        env:
          USE_EXISTING_CLUSTER: 'true'
        run: |
          cd agents/k8s-agent
          make test-e2e

  teardown-preview:
    name: Teardown Preview Environment
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_subset == '' || github.event.inputs.run_subset == 'all' || github.event.inputs.run_subset == 'deploy') }}
    runs-on: ubuntu-latest
    needs: deploy-preview-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform destroy
        env:
          TF_WORKSPACE: preview-${{ env.PREVIEW_ID }}
          PREVIEW_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          PREVIEW_RELEASE: ${{ env.PREVIEW_RELEASE }}
          SPOKE_HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}-spoke
        run: |
          set -euo pipefail
          cd terraform
          terraform init -backend-config=backend.hcl
          TF_WS="$TF_WORKSPACE"
          unset TF_WORKSPACE
          if terraform workspace list | grep -q "$TF_WS"; then
            terraform workspace select "$TF_WS"
            KUBECTL_CMD=$(terraform output -raw kubectl_config_command || true)
            if [ -n "$KUBECTL_CMD" ]; then
              eval "$KUBECTL_CMD"
              helm uninstall "$PREVIEW_RELEASE" --namespace "$PREVIEW_NAMESPACE" || true
              helm uninstall "$SPOKE_HELM_RELEASE" --namespace "$PREVIEW_NAMESPACE" || true
              kubectl delete namespace "$PREVIEW_NAMESPACE" --ignore-not-found || true
            fi
            terraform destroy -auto-approve || echo "Terraform destroy failed; manual cleanup may be required"
            terraform workspace select default
            terraform workspace delete "$TF_WS" || true
          else
            echo "Workspace $TF_WS not found; skipping destroy"
          fi
