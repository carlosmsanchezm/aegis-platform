name: Build, Test, and Deploy Preview

on:
  workflow_dispatch:
    inputs:
      run_subset:
        description: "Select which portion of the workflow to run"
        type: choice
        default: all
        options:
          - all
          - deploy
          - deploy-no-teardown
          - e2e-only
      preview_number:
        description: "Preview identifier (defaults to PR number or workflow run id)"
        required: false
      image_tag:
        description: "Override image tag for e2e-only runs (expects image already pushed)"
        required: false
  pull_request:

env:
  AWS_REGION: us-east-1
  PREVIEW_ID: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.preview_number != '' && github.event.inputs.preview_number || github.run_number) || github.event.number }}
  PREVIEW_NAMESPACE: preview-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.preview_number != '' && github.event.inputs.preview_number || github.run_number) || github.event.number }}
  PREVIEW_RELEASE: preview-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.preview_number != '' && github.event.inputs.preview_number || github.run_number) || github.event.number }}
  RUN_SUBSET: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.run_subset || 'all') || (github.event_name == 'pull_request' && 'all') || 'all' }}
  DEFAULT_E2E_IMAGE_TAG: 4439705b81f1478e1b7e38529a171a9232feb691
  MANUAL_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
# Requires repository secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.preview_number != '' && github.event.inputs.preview_number || github.run_number) || github.event.number }}
  cancel-in-progress: true

jobs:
  lint-and-unit-test:
    name: Lint & Unit Test
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skipping lint/unit for deploy-only run
        if: ${{ env.RUN_SUBSET != 'all' }}
        run: echo "RUN_SUBSET=${RUN_SUBSET}; skipping lint and unit tests."

      - name: Checkout code
        if: ${{ env.RUN_SUBSET == 'all' }}
        uses: actions/checkout@v4

      - name: Set up Go
        if: ${{ env.RUN_SUBSET == 'all' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go unit & integration tests
        if: ${{ env.RUN_SUBSET == 'all' }}
        run: |
          set -euo pipefail
          go work sync

          echo "Running make test in agents/k8s-agent"
          (cd agents/k8s-agent && make test)

          for module in pkg/workspace services/platform-api services/proxy; do
            echo "Running go test in $module"
            (cd "$module" && go test ./...)
          done

      - name: Set up Node.js
        if: ${{ env.RUN_SUBSET == 'all' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: aegis-platform/yarn.lock

      - name: Install frontend dependencies
        if: ${{ env.RUN_SUBSET == 'all' }}
        run: |
          cd aegis-platform
          yarn install --immutable

      - name: Run frontend unit tests
        if: ${{ env.RUN_SUBSET == 'all' }}
        run: |
          cd aegis-platform
          yarn test --watchAll=false

  build-and-push:
    name: Build & Push Images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    permissions:
      contents: read
    outputs:
      platform_api_image: ${{ steps.image-data.outputs.platform_api_image }}
      proxy_image: ${{ steps.image-data.outputs.proxy_image }}
      k8s_agent_image: ${{ steps.image-data.outputs.k8s_agent_image }}
      workspace_image: ${{ steps.image-data.outputs.workspace_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip build for non-full run
        if: ${{ env.RUN_SUBSET != 'all' }}
        run: echo "RUN_SUBSET=${RUN_SUBSET}; skipping image build."

      - name: Set up Docker Buildx
        if: ${{ env.RUN_SUBSET == 'all' }}
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tags
        if: ${{ env.RUN_SUBSET == 'all' }}
        id: image-data
        run: |
          set -euo pipefail
          ECR_REGISTRY='${{ steps.login-ecr.outputs.registry }}'
          IMAGE_TAG='${{ github.sha }}'
          echo "platform_api_image=${ECR_REGISTRY}/aegis/platform-api:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "proxy_image=${ECR_REGISTRY}/aegis/proxy:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "k8s_agent_image=${ECR_REGISTRY}/aegis/k8s-agent:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "workspace_image=${ECR_REGISTRY}/aegis/workspace-vscode:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if images already exist
        if: ${{ env.RUN_SUBSET == 'all' }}
        id: check-images
        env:
          PLATFORM_IMAGE: ${{ steps.image-data.outputs.platform_api_image }}
          PROXY_IMAGE: ${{ steps.image-data.outputs.proxy_image }}
          K8S_AGENT_IMAGE: ${{ steps.image-data.outputs.k8s_agent_image }}
          WORKSPACE_IMAGE: ${{ steps.image-data.outputs.workspace_image }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          needs_build=0
          for image in "$PLATFORM_IMAGE" "$PROXY_IMAGE" "$K8S_AGENT_IMAGE" "$WORKSPACE_IMAGE"; do
            repo="${image%:*}"
            tag="${image##*:}"
            repo_name="${repo#${ECR_REGISTRY}/}"
            if ! aws ecr describe-images --repository-name "$repo_name" --image-ids imageTag="$tag" >/dev/null 2>&1; then
              echo "Image $repo_name:$tag missing; will build"
              needs_build=1
            else
              echo "Image $repo_name:$tag already exists"
            fi
          done
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push images
        if: ${{ env.RUN_SUBSET == 'all' && steps.check-images.outputs.needs_build == '1' }}
        env:
          PLATFORM_IMAGE: ${{ steps.image-data.outputs.platform_api_image }}
          PROXY_IMAGE: ${{ steps.image-data.outputs.proxy_image }}
          K8S_AGENT_IMAGE: ${{ steps.image-data.outputs.k8s_agent_image }}
          WORKSPACE_IMAGE: ${{ steps.image-data.outputs.workspace_image }}
        run: |
          set -euo pipefail
          docker build -t "${PLATFORM_IMAGE}" -f services/platform-api/Dockerfile .
          docker build -t "${PROXY_IMAGE}" -f services/proxy/Dockerfile .
          docker build -t "${K8S_AGENT_IMAGE}" -f agents/k8s-agent/Dockerfile .
          docker build -t "${WORKSPACE_IMAGE}" workspace-images/openssh-vscode

          docker push "${PLATFORM_IMAGE}"
          docker push "${PROXY_IMAGE}"
          docker push "${K8S_AGENT_IMAGE}"
          docker push "${WORKSPACE_IMAGE}"

  deploy-preview-and-test:
    name: Deploy Preview & Run E2E Tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    outputs:
      preview_host: ${{ steps.deploy.outputs.preview_host }}
    env:
      USE_EXISTING_CLUSTER: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'

      - name: Determine image URIs for deployment
        id: image-uris
        run: |
          set -euo pipefail
          if [[ "${RUN_SUBSET}" == "all" ]]; then
            echo "platform=${{ needs.build-and-push.outputs.platform_api_image }}" >> "$GITHUB_OUTPUT"
            echo "proxy=${{ needs.build-and-push.outputs.proxy_image }}" >> "$GITHUB_OUTPUT"
            echo "agent=${{ needs.build-and-push.outputs.k8s_agent_image }}" >> "$GITHUB_OUTPUT"
            echo "workspace=${{ needs.build-and-push.outputs.workspace_image }}" >> "$GITHUB_OUTPUT"
          else
            IMAGE_TAG="${MANUAL_IMAGE_TAG}"
            if [[ -z "${IMAGE_TAG}" ]]; then
              IMAGE_TAG="${DEFAULT_E2E_IMAGE_TAG}"
            fi
            ECR_REGISTRY="567751785679.dkr.ecr.us-east-1.amazonaws.com"
            echo "platform=${ECR_REGISTRY}/aegis/platform-api:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            echo "proxy=${ECR_REGISTRY}/aegis/proxy:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            echo "agent=${ECR_REGISTRY}/aegis/k8s-agent:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            echo "workspace=${ECR_REGISTRY}/aegis/workspace-vscode:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform init & apply
        env:
          TF_WORKSPACE: preview-${{ env.PREVIEW_ID }}
          TF_VAR_environment: ${{ env.PREVIEW_RELEASE }}
        run: |
          set -euo pipefail
          cd terraform
          TF_WS="${TF_WORKSPACE}"
          unset TF_WORKSPACE
          STATE_KEY="aegis/previews/${TF_WS}/terraform.tfstate"
          terraform init -backend-config=backend.hcl -backend-config="key=${STATE_KEY}"
          terraform apply -auto-approve

      - name: Deploy control plane via Helm
        id: deploy
        env:
          PLATFORM_API_IMAGE_TAG: ${{ steps.image-uris.outputs.platform }}
          PROXY_IMAGE_TAG: ${{ steps.image-uris.outputs.proxy }}
          K8S_AGENT_IMAGE_TAG: ${{ steps.image-uris.outputs.agent }}
          HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}
          K8S_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          SPOKE_HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}-spoke
          SKIP_ROUTE53_UPDATE: '1'
          REUSE_EXISTING_DEPLOYMENT: ${{ env.RUN_SUBSET == 'e2e-only' && '1' || '0' }}
          AEGIS_PLATFORM_API_CERT: ${{ steps.image-uris.outputs.platform_api_cert }}
        run: |
          set -euo pipefail

          # Deploy via Terraform helper (skips Route53 update but now includes migrations)
          ./terraform/generate-cloud-deployment.sh --non-interactive --tls

      - name: Build pulumi preview CLI
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -o bin/pulumi-preview ./services/platform-api/cmd/pulumi-preview

      - name: Apply pulumi preview ProjectInfra manifest
        id: pulumi-preview-manifest
        run: |
          set -euo pipefail
          kubectl apply -f ops/previews/projectinfra-sample.yaml
          NAME="$(kubectl get -f ops/previews/projectinfra-sample.yaml -o jsonpath='{.metadata.name}')"
          NAMESPACE="$(kubectl get -f ops/previews/projectinfra-sample.yaml -o jsonpath='{.metadata.namespace}')"
          if [[ -z "${NAMESPACE}" ]]; then
            NAMESPACE="default"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"

      - name: Run pulumi preview CLI
        env:
          PROJECT_INFRA_NAME: ${{ steps.pulumi-preview-manifest.outputs.name }}
          PROJECT_INFRA_NAMESPACE: ${{ steps.pulumi-preview-manifest.outputs.namespace }}
        run: |
          set -euo pipefail
          ./bin/pulumi-preview --namespace "${PROJECT_INFRA_NAMESPACE}" --name "${PROJECT_INFRA_NAME}"

      - name: Cleanup pulumi preview ProjectInfra
        if: always()
        env:
          PROJECT_INFRA_NAME: ${{ steps.pulumi-preview-manifest.outputs.name }}
          PROJECT_INFRA_NAMESPACE: ${{ steps.pulumi-preview-manifest.outputs.namespace }}
        run: |
          set -euo pipefail
          if [[ -n "${PROJECT_INFRA_NAME}" ]]; then
            kubectl delete projectinfra "${PROJECT_INFRA_NAME}" -n "${PROJECT_INFRA_NAMESPACE}" --ignore-not-found
          fi
      - name: Update Route53 and configure E2E endpoints
        id: configure-e2e
        env:
          HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}
          K8S_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          TF_VAR_environment: ${{ env.PREVIEW_RELEASE }}
        run: |
          set -euo pipefail

          # Extract actual LoadBalancer hostnames from Kubernetes services
          echo "⏳ Waiting for LoadBalancers to be provisioned..."

          # Wait for platform-api LoadBalancer (max 5 minutes)
          for i in {1..60}; do
            PLATFORM_LB=$(kubectl get svc "${HELM_RELEASE}-platform-api" -n "${K8S_NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${PLATFORM_LB}" ]; then
              echo "✅ Platform API LoadBalancer ready: ${PLATFORM_LB}"
              break
            fi
            echo "  Waiting for platform-api LoadBalancer... (${i}/60)"
            sleep 5
          done

          # Wait for proxy LoadBalancer (max 5 minutes)
          for i in {1..60}; do
            PROXY_LB=$(kubectl get svc "${HELM_RELEASE}-proxy" -n "${K8S_NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${PROXY_LB}" ]; then
              echo "✅ Proxy LoadBalancer ready: ${PROXY_LB}"
              break
            fi
            echo "  Waiting for proxy LoadBalancer... (${i}/60)"
            sleep 5
          done

          # Verify LoadBalancers were obtained
          if [ -z "${PLATFORM_LB}" ] || [ -z "${PROXY_LB}" ]; then
            echo "❌ Failed to get LoadBalancer hostnames after 5 minutes"
            exit 1
          fi

          # Update Route53 DNS records with actual LoadBalancer hostnames
          echo ""
          echo "🌐 Updating Route53 DNS records..."
          cd terraform
          terraform apply -auto-approve \
            -var="platform_api_lb_hostname=${PLATFORM_LB}" \
            -var="proxy_lb_hostname=${PROXY_LB}" \
            -target=aws_route53_record.platform_api_grpc \
            -target=aws_route53_record.platform_api_http \
            -target=aws_route53_record.proxy

          # Get the DNS names from Terraform outputs (now updated)
          PLATFORM_DNS=$(terraform output -raw dns_platform_api_grpc 2>/dev/null || echo "")
          PROXY_DNS=$(terraform output -raw dns_proxy 2>/dev/null || echo "")

          # Remove trailing dots from DNS names if present
          PLATFORM_DNS=${PLATFORM_DNS%.}
          PROXY_DNS=${PROXY_DNS%.}

          echo "✅ Route53 records updated:"
          echo "   ${PLATFORM_DNS} → ${PLATFORM_LB}"
          echo "   ${PROXY_DNS} → ${PROXY_LB}"

          echo ""
          echo "🔍 Resolving LoadBalancer IPs for local overrides..."
          PLATFORM_IP=$(dig +short "${PLATFORM_LB}" | head -1)
          PROXY_IP=$(dig +short "${PROXY_LB}" | head -1)

          if [ -n "${PLATFORM_IP}" ]; then
            echo "   Platform API LB IP: ${PLATFORM_IP}"
            sudo sed -i.bak "/${PLATFORM_DNS}/d" /etc/hosts 2>/dev/null || true
            echo "${PLATFORM_IP} ${PLATFORM_DNS}" | sudo tee -a /etc/hosts >/dev/null
          fi

          if [ -n "${PROXY_IP}" ]; then
            echo "   Proxy LB IP: ${PROXY_IP}"
            sudo sed -i.bak "/${PROXY_DNS}/d" /etc/hosts 2>/dev/null || true
            echo "${PROXY_IP} ${PROXY_DNS}" | sudo tee -a /etc/hosts >/dev/null
          fi

          sudo resolvectl flush-caches || true
          echo "🔄 Local resolver cache flushed (hosts file overrides in place)"

          # Output DNS names for E2E tests (use DNS, not LoadBalancer directly)
          echo "grpc_addr=${PLATFORM_DNS}:8081" >> "$GITHUB_OUTPUT"
          echo "grpc_host=${PLATFORM_DNS}" >> "$GITHUB_OUTPUT"
          echo "proxy_hostname=${PROXY_DNS}" >> "$GITHUB_OUTPUT"
          echo "grpc_ca=${HOME}/aegis-platform-api-ca.crt" >> "$GITHUB_OUTPUT"

          echo ""
          echo "📋 E2E Test Endpoints (via DNS):"
          echo "   Platform API gRPC: ${PLATFORM_DNS}:8081"
          echo "   Proxy:             ${PROXY_DNS}:8080"
          echo "   CA Bundle:         ${HOME}/aegis-platform-api-ca.crt"

      - name: Install test tooling
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          sudo apt-get update
          sudo apt-get install -y jq
          GRPCURL_VERSION=1.9.3
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64)
              GRPCURL_PACKAGE_ARCH=linux_x86_64
              ;;
            arm64|aarch64)
              GRPCURL_PACKAGE_ARCH=linux_arm64
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac
          TMPDIR=$(mktemp -d)
          ASSET="grpcurl_${GRPCURL_VERSION}_${GRPCURL_PACKAGE_ARCH}.tar.gz"
          CURL_URL="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/${ASSET}"
          if ! curl -fsSL "$CURL_URL" -o "$TMPDIR/$ASSET"; then
            echo "Failed to download grpcurl from $CURL_URL" >&2
            exit 1
          fi
          tar -xzf "$TMPDIR/$ASSET" -C "$TMPDIR" grpcurl
          sudo install "$TMPDIR/grpcurl" /usr/local/bin/grpcurl
          rm -rf "$TMPDIR"

      - name: Run platform API E2E tests
        env:
          AEGIS_GRPC_ADDR: ${{ steps.configure-e2e.outputs.grpc_addr }}
          AEGIS_PROXY_HOSTNAME: ${{ steps.configure-e2e.outputs.proxy_hostname }}
          GRPC_TLS: '1'
          GRPC_CA: ${{ steps.configure-e2e.outputs.grpc_ca }}
          GRPC_TLS_SERVER_NAME: ${{ steps.configure-e2e.outputs.grpc_host }}
          AEGIS_WORKLOAD_NAMESPACE: aegis-workloads
          AEGIS_PLATFORM_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          AEGIS_PLATFORM_SERVICE: ${{ env.PREVIEW_RELEASE }}-platform-api
          AEGIS_PLATFORM_DEPLOYMENT: ${{ env.PREVIEW_RELEASE }}-platform-api
        run: |
          set -euo pipefail
          echo "🧪 Running E2E tests against preview environment (via DNS):"
          echo "   gRPC Address: ${AEGIS_GRPC_ADDR}"
          echo "   Proxy:        ${AEGIS_PROXY_HOSTNAME}"
          echo "   Namespace:    ${AEGIS_PLATFORM_NAMESPACE}"
          echo "   CA Bundle:    ${GRPC_CA}"
          echo "   TLS:          Enabled"
          echo ""

          SCRIPT_ROOT="${{ github.workspace }}"
          bash "${SCRIPT_ROOT}/scripts/e2e-platform-api.sh"

      - name: Workspace connectivity smoke test
        if: ${{ env.RUN_SUBSET == 'all' || env.RUN_SUBSET == 'e2e-only' }}
        env:
          WORKSPACE_IMAGE: ${{ steps.image-uris.outputs.workspace }}
          AEGIS_GRPC_ADDR: ${{ steps.configure-e2e.outputs.grpc_addr }}
          AEGIS_GRPC_CA: ${{ steps.configure-e2e.outputs.grpc_ca }}
          AEGIS_GRPC_HOST: ${{ steps.configure-e2e.outputs.grpc_host }}
          VSCODE_COMMIT: 3a6ee6c4e95174c64ca96ca0a0ffcd4bd71bd8e5
        run: |
          set -euo pipefail
          echo "🧪 Workspace connectivity smoke test using image ${WORKSPACE_IMAGE}"
          export GRPC_ADDR=${AEGIS_GRPC_ADDR}
          export GRPC_TLS=1
          export GRPC_CA=${AEGIS_GRPC_CA}
          export GRPC_TLS_SERVER_NAME=${AEGIS_GRPC_HOST}
          export WORKSPACE_NAMESPACE=aegis-workloads
          export CLEANUP=1
          scripts/test-workspace-connection.sh "${WORKSPACE_IMAGE}"
          cat .aegis/workspace-session.json || true
          rm -f .aegis/workspace-session.json || true

      - name: Run k8s-agent E2E tests
        if: ${{ env.RUN_SUBSET == '' || env.RUN_SUBSET == 'all' || env.RUN_SUBSET == 'deploy-no-teardown' || env.RUN_SUBSET == 'e2e-only' }}

        env:
          USE_EXISTING_CLUSTER: ${{ env.USE_EXISTING_CLUSTER }}
          KIND_CLUSTER: aegis-e2e
          K8S_AGENT_E2E_IMAGE: ${{ steps.image-uris.outputs.agent }}
          K8S_AGENT_E2E_SKIP_BUILD: 'true'
        run: |
          cd agents/k8s-agent
          make test-e2e

      - name: Promote images to latest
        if: ${{ env.RUN_SUBSET == 'all' && success() }}
        env:
          PLATFORM_IMAGE: ${{ needs.build-and-push.outputs.platform_api_image }}
          PROXY_IMAGE: ${{ needs.build-and-push.outputs.proxy_image }}
          K8S_AGENT_IMAGE: ${{ needs.build-and-push.outputs.k8s_agent_image }}
          WORKSPACE_IMAGE: ${{ needs.build-and-push.outputs.workspace_image }}
        run: |
          set -euo pipefail
          promote() {
            local image="$1"
            local repo="${image%:*}"
            local tag="${image##*:}"
            local registry="${repo%%/*}"
            local repo_name="${repo#${registry}/}"
            echo "Promoting ${repo_name}:${tag} -> latest"
            local manifest
            manifest=$(aws ecr batch-get-image \
              --repository-name "$repo_name" \
              --image-ids imageTag="$tag" \
              --query 'images[0].imageManifest' \
              --output text)
            if [ -z "$manifest" ]; then
              echo "Failed to retrieve manifest for ${repo_name}:${tag}" >&2
              exit 1
            fi
            aws ecr put-image \
              --repository-name "$repo_name" \
              --image-tag latest \
              --image-manifest "$manifest" >/dev/null
          }
          promote "$PLATFORM_IMAGE"
          promote "$PROXY_IMAGE"
          promote "$K8S_AGENT_IMAGE"
          promote "$WORKSPACE_IMAGE"

  teardown-preview:
    name: Teardown Preview Environment
    if: ${{ false }}  # Temporarily disabled for testing
    runs-on: ubuntu-latest
    needs: deploy-preview-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform destroy
        env:
          TF_WORKSPACE: preview-${{ env.PREVIEW_ID }}
          PREVIEW_NAMESPACE: ${{ env.PREVIEW_NAMESPACE }}
          PREVIEW_RELEASE: ${{ env.PREVIEW_RELEASE }}
          SPOKE_HELM_RELEASE: ${{ env.PREVIEW_RELEASE }}-spoke
          TF_VAR_environment: ${{ env.PREVIEW_RELEASE }}
        run: |
          set -euo pipefail
          cd terraform
          TF_WS="${TF_WORKSPACE}"
          unset TF_WORKSPACE
          STATE_KEY="aegis/previews/${TF_WS}/terraform.tfstate"
          terraform init -backend-config=backend.hcl -backend-config="key=${STATE_KEY}"
          if terraform state pull >/dev/null 2>&1; then
            KUBECTL_CMD=$(terraform output -raw kubectl_config_command || true)
            if [ -n "$KUBECTL_CMD" ]; then
              eval "$KUBECTL_CMD"
              helm uninstall "$PREVIEW_RELEASE" --namespace "$PREVIEW_NAMESPACE" || true
              helm uninstall "$SPOKE_HELM_RELEASE" --namespace "$PREVIEW_NAMESPACE" || true
              kubectl delete namespace "$PREVIEW_NAMESPACE" --ignore-not-found || true
            fi
            terraform destroy -auto-approve || echo "Terraform destroy failed; manual cleanup may be required"
          else
            echo "Terraform state for ${TF_WS} not found; skipping destroy"
          fi
