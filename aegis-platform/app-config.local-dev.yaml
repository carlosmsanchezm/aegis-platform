# Local development configuration - points to local platform-api via port-forward
# Requires: make port-forward (forwards to localhost:10080)

proxy:
  endpoints:
    '/aegis':
      target: 'http://platform-api.localtest.me'
      secure: false
      headers:
        Host: platform-api.localtest.me
      changeOrigin: true
      credentials: forward
      allowedHeaders:
        - authorization
        - Authorization
        - x-aegis-user
        - X-Aegis-User
        - grpc-metadata-authorization
        - Grpc-Metadata-Authorization
        - grpc-metadata-x-aegis-user
        - Grpc-Metadata-X-Aegis-User
