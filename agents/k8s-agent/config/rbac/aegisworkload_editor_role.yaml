# This rule is not used by the project k8s-agent itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the aegis.yourorg.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-agent
    app.kubernetes.io/managed-by: kustomize
  name: aegisworkload-editor-role
rules:
- apiGroups:
  - aegis.yourorg.dev
  resources:
  - aegisworkloads
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aegis.yourorg.dev
  resources:
  - aegisworkloads/status
  verbs:
  - get
