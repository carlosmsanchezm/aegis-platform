apiVersion: v2
name: aegis-services
description: A unified Helm chart for deploying Aegis platform-api and proxy services
type: application
version: 0.1.0
appVersion: "latest"
home: "https://github.com/carlosmsanchezm/aegis"
maintainers:
  - name: Aegis Team
    email: team@yourorg.dev
keywords:
  - aegis
  - platform-api
  - proxy
  - microservices
  - kubernetes
sources:
  - https://github.com/carlosmsanchezm/aegis
dependencies:
  - name: ingress-nginx
    version: "4.11.3"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingressController.enabled
  - name: cert-manager
    version: "v1.16.2"
    repository: https://charts.jetstack.io
    condition: pki.certManager.enabled
  - name: step-certificates
    version: "1.28.4"
    repository: https://smallstep.github.io/helm-charts
    condition: pki.stepCa.enabled
    alias: step-ca
  - name: step-issuer
    version: "1.9.11"
    repository: https://smallstep.github.io/helm-charts
    condition: pki.stepIssuer.enabled
