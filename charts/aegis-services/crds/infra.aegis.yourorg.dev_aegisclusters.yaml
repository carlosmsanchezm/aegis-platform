apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aegisclusters.infra.aegis.yourorg.dev
spec:
  group: infra.aegis.yourorg.dev
  names:
    kind: AegisCluster
    listKind: AegisClusterList
    plural: aegisclusters
    singular: aegiscluster
    shortNames:
      - aegisc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: AegisCluster mirrors cluster metadata and status sourced from the Aegis control plane store.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clusterId
                - projectId
                - provider
                - region
              properties:
                clusterId:
                  type: string
                projectId:
                  type: string
                provider:
                  type: string
                region:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                flavors:
                  type: array
                  items:
                    type: string
                capacity:
                  type: object
                  additionalProperties:
                    type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                lastHeartbeat:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Project
          type: string
          jsonPath: .spec.projectId
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Phase
          type: string
          jsonPath: .status.phase
