{{- $backstage := .Values.backstage | default dict -}}
{{- if and $backstage.enabled ($backstage.caBundle | default dict) -}}
{{- $ca := $backstage.caBundle | default dict -}}
{{- if $ca.create -}}
{{- $bundle := "" -}}
{{- if $ca.data -}}
{{- $bundle = trim $ca.data -}}
{{- else -}}
{{- $parts := list -}}
{{- with .Values.platformApi -}}
  {{- with .tls -}}
    {{- if .cert -}}
      {{- $trimmed := trim .cert -}}
      {{- if $trimmed -}}
        {{- $parts = append $parts $trimmed -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- with .Values.keycloak -}}
  {{- with .tls -}}
    {{- with .secret -}}
      {{- if .cert -}}
        {{- $trimmed := trim .cert -}}
        {{- if $trimmed -}}
          {{- $parts = append $parts $trimmed -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if gt (len $parts) 0 -}}
  {{- $bundle = join "\n" $parts -}}
{{- end -}}
{{- end -}}
{{- if $bundle -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-services.backstage.caBundleSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.backstage.labels" . | nindent 4 }}
type: Opaque
data:
  aegis-local-trust.pem: {{ $bundle | b64enc }}
{{- end -}}
{{- end -}}
{{- end -}}
