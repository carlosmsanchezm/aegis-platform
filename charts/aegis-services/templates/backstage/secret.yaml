{{- $backstage := .Values.backstage | default dict -}}
{{- $secrets := $backstage.secrets | default dict -}}
{{- if and $backstage.enabled ($secrets.create | default false) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-services.backstage.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.backstage.labels" . | nindent 4 }}
type: Opaque
stringData:
  backend-secret: {{ required "backstage.secrets.backendSecret is required when backstage.secrets.create=true" $secrets.backendSecret | quote }}
{{- end }}
