{{- if and .Values.networkPolicy.enabled (ne (default "dev" .Values.hardeningProfile) "dev") }}
# Allow platform-api egress to DNS, Kubernetes API, PostgreSQL, and Keycloak
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis-services.fullname" . }}-platform-api-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: platform-api
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API, PostgreSQL, Keycloak, platform-api gRPC
    - ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 8081
          protocol: TCP
{{- end }}
