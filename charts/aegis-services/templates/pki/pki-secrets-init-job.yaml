{{- $pki := .Values.pki | default dict -}}
{{- if $pki.enabled -}}
{{- $ext := $pki.external | default dict -}}
{{- $pkiNs := $ext.namespace | default "aegis-pki" -}}
{{- $releaseName := $ext.releaseName | default "step-certificates" -}}
{{- $oidcCa := $pki.oidcCa | default dict -}}
{{- $spokeProxy := $pki.spokeProxyCa | default dict -}}
{{- $trustBundle := $pki.trustBundleSecretName | default "aegis-trust-bundle" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegis-services.fullname" . }}-pki-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aegis-services.fullname" . }}-pki-init
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aegis-services.fullname" . }}-pki-init
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aegis-services.fullname" . }}-pki-init
subjects:
  - kind: ServiceAccount
    name: {{ include "aegis-services.fullname" . }}-pki-init
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aegis-services.fullname" . }}-pki-secrets-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: pki-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "aegis-services.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pki-init
    spec:
      serviceAccountName: {{ include "aegis-services.fullname" . }}-pki-init
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pki-secrets-init
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail

              RELEASE="{{ $releaseName }}"
              PKI_NS="{{ $pkiNs }}"
              TARGET_NS="{{ .Release.Namespace }}"
              TRUST_BUNDLE="{{ $trustBundle }}"

              echo "=== PKI Secrets Init ==="
              echo "PKI namespace: ${PKI_NS}"
              echo "Target namespace: ${TARGET_NS}"

              # 1. Cross-namespace provisioner password
              echo "--- Step 1: Propagating step-ca provisioner password ---"
              PROV_SECRET="${RELEASE}-provisioner-password"
              if kubectl get secret "${PROV_SECRET}" -n "${PKI_NS}" >/dev/null 2>&1; then
                PROV_PWD=$(kubectl get secret "${PROV_SECRET}" -n "${PKI_NS}" \
                  -o jsonpath='{.data.password}' | base64 -d)
                kubectl create secret generic step-ca-credentials \
                  --namespace "${TARGET_NS}" \
                  --from-literal=provisioner-password="${PROV_PWD}" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "step-ca-credentials created/updated in ${TARGET_NS}"
              else
                echo "WARNING: ${PROV_SECRET} not found in ${PKI_NS}; skipping step-ca-credentials"
              fi

              {{- if eq ($oidcCa.source | default "") "trustBundle" }}
              # 2. OIDC CA from trust bundle
              echo "--- Step 2: Creating OIDC CA from trust bundle ---"
              if kubectl get secret "${TRUST_BUNDLE}" -n "${TARGET_NS}" >/dev/null 2>&1; then
                ROOT_CA=$(kubectl get secret "${TRUST_BUNDLE}" -n "${TARGET_NS}" \
                  -o jsonpath='{.data.ca\.crt}' | base64 -d)
                kubectl create secret generic aegis-platform-api-oidc-ca \
                  --namespace "${TARGET_NS}" \
                  --from-literal=ca.crt="${ROOT_CA}" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "aegis-platform-api-oidc-ca created/updated in ${TARGET_NS}"
              else
                echo "WARNING: ${TRUST_BUNDLE} not found in ${TARGET_NS}; skipping OIDC CA"
              fi
              {{- end }}

              {{- if ($spokeProxy.autoGenerate | default false) }}
              # 3. Spoke-proxy CA auto-generation
              echo "--- Step 3: Auto-generating spoke-proxy CA ---"
              SPOKE_CA_SECRET="{{ $spokeProxy.secretName | default "spoke-proxy-ca" }}"
              if ! kubectl get secret "${SPOKE_CA_SECRET}" -n "${TARGET_NS}" >/dev/null 2>&1; then
                echo "Generating new spoke-proxy CA..."
                openssl genrsa -out /tmp/ca.key 4096
                openssl req -x509 -new -nodes -key /tmp/ca.key -sha256 -days 3650 \
                  -out /tmp/ca.crt -subj "/O=Aegis Platform/CN=Aegis Spoke-Proxy CA" \
                  -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
                  -addext "keyUsage=critical,keyCertSign,cRLSign"
                kubectl create secret generic "${SPOKE_CA_SECRET}" \
                  --namespace "${TARGET_NS}" \
                  --from-file=ca.crt=/tmp/ca.crt --from-file=ca.key=/tmp/ca.key \
                  --dry-run=client -o yaml | kubectl apply -f -
                rm -f /tmp/ca.key /tmp/ca.crt
                echo "${SPOKE_CA_SECRET} created in ${TARGET_NS}"
              else
                echo "${SPOKE_CA_SECRET} already exists in ${TARGET_NS}; skipping"
              fi
              {{- end }}

              echo "=== PKI Secrets Init Complete ==="
{{- end }}
