{{- /*
StepClusterIssuer for cert-manager integration with step-ca.

This template is a STATIC fallback that only renders when rootCABundle and
provisionerKID are pre-configured in values. For dynamic configuration after
step-ca bootstrap, use the configure-issuer-job.yaml hook instead.

Rendered only when:
  - pki.enabled is true
  - pki.stepCa.enabled is true
  - pki.stepIssuer.enabled is true
  - pki.rootCABundle is set (pre-configured)
  - pki.provisionerKID is set (pre-configured)
  - certmanager.step.sm/v1beta1 CRD is available
*/ -}}

{{- $pki := .Values.pki | default dict -}}
{{- $hasStaticConfig := and ($pki.rootCABundle | default "") ($pki.provisionerKID | default "") -}}
{{- if and ($pki.enabled | default false) (($pki.stepCa | default dict).enabled | default false) (($pki.stepIssuer | default dict).enabled | default false) $hasStaticConfig -}}
{{- if .Capabilities.APIVersions.Has "certmanager.step.sm/v1beta1" -}}
{{- $stepCa := $pki.stepCa | default dict -}}
{{- $ca := $stepCa.ca | default dict -}}
{{- $provisioner := $ca.provisioner | default dict -}}
{{- $ns := include "aegis-services.pki.namespace" . -}}
apiVersion: certmanager.step.sm/v1beta1
kind: StepClusterIssuer
metadata:
  name: {{ include "aegis-services.pki.clusterIssuerName" . }}
  labels:
    {{- include "aegis-services.pki.labels" . | nindent 4 }}
spec:
  # URL of the step-ca server
  url: {{ include "aegis-services.pki.stepCa.serviceURL" . }}

  # Base64-encoded root CA certificate (pre-configured)
  caBundle: {{ $pki.rootCABundle | b64enc }}

  # Provisioner configuration
  provisioner:
    name: {{ $provisioner.name | default "aegis" }}
    kid: {{ $pki.provisionerKID | quote }}
    passwordRef:
      name: {{ include "aegis-services.pki.stepCa.provisionerSecretName" . }}
      namespace: {{ $ns }}
      key: password
{{- end -}}
{{- end -}}
