{{- $httpIngress := .Values.platformApi.httpIngress | default (dict) -}}
{{- if and .Values.platformApi.enabled ($httpIngress.enabled | default false) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aegis-services.platformApi.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
  {{- with $httpIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $httpIngress.className }}
  ingressClassName: {{ $httpIngress.className }}
  {{- end }}
  {{- if $httpIngress.tls }}
  tls:
    {{- range $httpIngress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $httpIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- else }}
            pathType: Prefix
            {{- end }}
            backend:
              service:
                name: {{ include "aegis-services.platformApi.fullname" $ }}
                port:
                  number: {{ $.Values.platformApi.service.httpPort }}
          {{- end }}
    {{- end }}
{{- end }}
