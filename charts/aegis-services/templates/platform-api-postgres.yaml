{{- $platform := .Values.platformApi | default dict -}}
{{- $postgres := $platform.postgres | default dict -}}
{{- $postgresEnabled := ternary $postgres.enabled true (hasKey $postgres "enabled") }}
{{- if and ($platform.enabled | default false) $postgresEnabled }}
apiVersion: v1
kind: Service
metadata:
  name: platform-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-postgres
    app.kubernetes.io/name: platform-postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: platform-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-postgres
    app.kubernetes.io/name: platform-postgres
spec:
  serviceName: platform-postgres
  replicas: {{ default 1 $postgres.replicaCount }}
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: platform-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: platform-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ default "postgres" $postgres.image.repository }}:{{ default "16-alpine" $postgres.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $postgres.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ default "aegis_platform" $postgres.dbName | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: {{ default "aegis_platform" $postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegis-services.platformApi.secretName" . }}
                  key: db-password
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "100m" "memory" "256Mi") "limits" (dict "cpu" "500m" "memory" "512Mi")) $postgres.resources) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ default "5Gi" $postgres.storage.size | quote }}
{{- end }}

