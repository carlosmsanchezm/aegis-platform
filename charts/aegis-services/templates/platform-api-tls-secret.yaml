{{- $tls := .Values.platformApi.tls | default dict -}}
{{- $cm := $tls.certManager | default dict -}}
{{- if and .Values.platformApi.enabled ($tls.enabled | default false) (not ($cm.enabled | default false)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-services.platformApi.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
  annotations:
    aegis.yourorg.dev/tls-purpose: "grpc"
type: kubernetes.io/tls
data:
  tls.crt: {{ required "platformApi.tls.cert must be provided when platformApi.tls.enabled is true and cert-manager integration is disabled" $tls.cert | b64enc }}
  tls.key: {{ required "platformApi.tls.key must be provided when platformApi.tls.enabled is true and cert-manager integration is disabled" $tls.key | b64enc }}
  {{- if $tls.clientCA }}
  ca.crt: {{ $tls.clientCA | b64enc }}
  {{- end }}
{{- end }}
