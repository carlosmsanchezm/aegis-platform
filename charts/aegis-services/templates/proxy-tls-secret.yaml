{{- $tls := .Values.proxy.tls | default dict -}}
{{- $cm := $tls.certManager | default dict -}}
{{- if and .Values.proxy.enabled ($tls.enabled | default false) (not ($cm.enabled | default false)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-services.proxy.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
type: kubernetes.io/tls
data:
  {{- $cert := required "proxy.tls.cert must be provided when proxy.tls.enabled is true and cert-manager integration is disabled" $tls.cert }}
  {{- $key := required "proxy.tls.key must be provided when proxy.tls.enabled is true and cert-manager integration is disabled" $tls.key }}
  tls.crt: {{ $cert | b64enc }}
  tls.key: {{ $key | b64enc }}
{{- end }}
