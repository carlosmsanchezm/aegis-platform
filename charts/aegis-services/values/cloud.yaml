# Cloud production values for aegis-services
# This configuration is optimized for production-like environments
# on cloud platforms like AWS EKS, GCP GKE, or Azure AKS

#################################################################
# Platform API Configuration - Cloud
#################################################################
global:
  imagePullSecrets:
    - name: ecr-registry-secret

platformApi:
  enabled: true
  replicaCount: 1  # Single instance for resource constraints
  serviceAccountName: aegis-platform-api
  # Set to an IAM role ARN to enable IRSA (IAM Roles for Service Accounts).
  # When set, the pod receives temporary AWS credentials automatically via
  # projected service account tokens — no static AWS_ACCESS_KEY_ID needed.
  # Example: arn:aws:iam::123456789012:role/aegis-platform-api
  irsaRoleArn: "arn:aws:iam::195714074609:role/aegis-platform-api"

  image:
    repository: 195714074609.dkr.ecr.us-east-1.amazonaws.com/aegis/platform-api
    tag: "8afb9e0-vscode-dynamic"  # VS Code port fix build with dynamic VS Code commit support
    pullPolicy: Always  # EKS must always pull from ECR to get latest image

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    grpcPort: 8081
    httpPort: 8080

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts: []
    tls: []

  # Production environment variables
  env:
    LOG_LEVEL: "info"
    ENVIRONMENT: "production"
    AEGIS_STORE_BACKEND: "postgres"
    # Auto-bootstrap workspace dependencies (flavors, queues, projects) on first reference
    AEGIS_AUTO_BOOTSTRAP_WORKSPACES: "true"
    # Override DockerHub workspace images with the production ECR image
    AEGIS_DEFAULT_WORKSPACE_IMAGE: "195714074609.dkr.ecr.us-east-1.amazonaws.com/aegis/workspace-vscode:latest"
    # Enable automatic observability stack deployment on spoke clusters
    AEGIS_OBSERVABILITY_ENABLED: "true"
    AEGIS_PROXY_BASE_URL: "wss://proxy.yourdomain.com:8080"
    # AEGIS_PROXY_BASE_URL is automatically set to the proxy service if proxy.enabled=true
    # For external proxy, set this to the public URL (e.g., "https://proxy.yourdomain.com")
    AEGIS_PROXY_EXPECTED_AUDIENCE: "aegis-proxy"
    DB_HOST: "platform-postgres.aegis-system.svc.cluster.local"
    DB_PORT: "5432"
    DB_NAME: "aegis_platform"
    DB_USER: "aegis_platform"
    DB_SSLMODE: "disable"
    PG_MAX_OPEN_CONNS: "50"
    PG_MAX_IDLE_CONNS: "10"
    PG_CONN_MAX_LIFETIME: "30m"
    OIDC_AUDIENCE: "backstage,aegis-platform"
    REQUIRE_PHISHING_RESISTANT_MFA: "false"
    AEGIS_INFRA_CONTROLLER: "true"
    AEGIS_INFRA_NAMESPACE: "aegis-system"
    PULUMI_BACKEND_URL: "s3://aegis-pulumi-state-195714074609/aegis/pulumi"
    PULUMI_CONFIG_PASSPHRASE: "aegis-local-passphrase"
    AWS_REGION: "us-east-1"
    AWS_DEFAULT_REGION: "us-east-1"
    # --- Spoke provisioning: Pulumi runner reads these to configure spoke clusters ---
    # Platform API endpoint that spokes connect to (gRPC).
    # Set to the public Cloudflare hostname; override via deploy script if needed.
    AEGIS_PLATFORM_API_ENDPOINT: "platform-api.aegis-platform.tech:8081"
    AEGIS_PLATFORM_API_GRPC_INSECURE: "false"
    # Spoke images: ECR registry for cloud-provisioned spokes
    AEGIS_SPOKE_IMAGE_REPO: "195714074609.dkr.ecr.us-east-1.amazonaws.com/aegis/k8s-agent"
    AEGIS_SPOKE_IMAGE_TAG: ""  # Set via deploy script override (git SHA)
    # Spoke Helm chart values file for cloud deployments
    AEGIS_SPOKE_VALUES_FILE: "/root/charts/aegis-spoke/values-cloud-remote.yaml"
    # OIDC configuration for spoke agent authentication
    AEGIS_SPOKE_OIDC_TOKEN_URL: "https://keycloak.aegis-platform.tech/realms/aegis/protocol/openid-connect/token"
    AEGIS_SPOKE_OIDC_CLIENT_ID: "spoke-agent"
    AEGIS_SPOKE_OIDC_CLIENT_SECRET: ""  # Set via deploy script or --set
    AEGIS_SPOKE_OIDC_AUDIENCE: "aegis-platform"
    # Spoke-proxy: empty means agent auto-discovers from LoadBalancer Service
    AEGIS_SPOKE_PROXY_HOST: ""

  # Production secrets (configure externally)
  # Note: AEGIS_PROXY_JWT_SECRET is automatically configured from proxy.jwtSecret when proxy.enabled=true
  envFromSecret:
    DB_PASSWORD: "db-password"

  # Production kubeconfig configuration
  kubeConfigsDir: "/etc/kubeconfigs"
  kubeConfigsSecretName: "aegis-kubeconfigs"
  targetNamespace: "aegis-workloads"

  # Cluster configurations for workload placement
  # The platform-api uses these to connect to spoke clusters
  # For multi-cluster deployments, add additional clusters here
  clusters:
    # In-cluster configuration (when platform-api runs in the same cluster as workloads)
    aws-us-east-1-prod:
      inCluster: true  # Uses service account token from the pod

  # Additional secrets for production (values set via CI/CD)
  secrets: {}
    # db-password: ""  # Set via --set-string
    # proxy-jwt-secret: ""   # Set via --set-string

  # Production volume mounts
  volumeMounts:
    - name: kubeconfigs
      mountPath: /etc/kubeconfigs
      readOnly: true

  volumes:
    - name: kubeconfigs
      secret:
        secretName: aegis-kubeconfigs

  # Production resource allocation
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

  # Health probes disabled until endpoints available
  livenessProbe: null
  readinessProbe: null

  # Security context (disabled for now - binary permissions issue)
  # securityContext:
  #   runAsNonRoot: true
  #   runAsUser: 1000
  #   fsGroup: 2000

  # containerSecurityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop:
  #       - ALL
  #   readOnlyRootFilesystem: true
  #   runAsNonRoot: true
  #   runAsUser: 1000

  # Spread across zones for availability
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - platform-api
            topologyKey: topology.kubernetes.io/zone

  postgres:
    # Iron Bank PostgreSQL image for platform-api database
    # For testing without registry1 auth: docker.io/postgres:16
    image:
      repository: registry1.dso.mil/ironbank/opensource/postgres/postgresql16
      tag: "16"
      pullPolicy: Always
    storage:
      className: ebs-gp3

  migrations:
    enabled: false  # Disabled: GHCR rate-limited; migrations run via Step 6b (in-cluster psql)
    image:
      repository: ghcr.io/golang-migrate/migrate
      tag: v4.16.2
      pullPolicy: IfNotPresent
    ttlSecondsAfterFinished: 300
    args:
      - "-path=/migrations"
      - "-database=$(DATABASE_URL)"
      - "up"

#################################################################
# Proxy Configuration - Cloud
#################################################################
proxy:
  enabled: true
  replicaCount: 1  # Until shared JTI backend is deployed

  image:
    repository: 195714074609.dkr.ecr.us-east-1.amazonaws.com/aegis/proxy
    tag: "no-client-cert"  # Updated to disable mTLS client cert requirement for VS Code
    pullPolicy: Always  # EKS must always pull from ECR to get latest image

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    port: 8080

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts: []
    tls: []

  # Production JWT secret (set via external secret management)
  jwtSecret: ""  # MUST be set via --set-string in production
  expectedAudience: "aegis-proxy"
  allowedSuffix: ".svc.cluster.local"
  cluster: "aws-us-east-1-prod"  # Must match the cluster ID in platformApi.clusters
  publicHost: "proxy.yourdomain.com"

  # Production secrets (configure externally)
  # envFromSecret:
  #   JWT_SECRET: "jwt-secret"  # Not needed - already set via AEGIS_PROXY_JWT_SECRET in template

  # Additional secrets for production
  secrets: {}
    # custom-cert: ""  # Set via --set-string

  # TLS enabled for production
  tls:
    enabled: true
    cert: ""
    key: ""

  # Production environment variables
  env:
    LOG_LEVEL: "info"
    ENVIRONMENT: "production"

  # Production resource allocation
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

  # Production-grade probes
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Security context (disabled for now - binary permissions issue)
  # securityContext:
  #   runAsNonRoot: true
  #   runAsUser: 1000
  #   fsGroup: 2000

  # containerSecurityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop:
  #       - ALL
  #   readOnlyRootFilesystem: true
  #   runAsNonRoot: true
  #   runAsUser: 1000

  # Spread across zones for availability
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - proxy
            topologyKey: topology.kubernetes.io/zone

#################################################################
# Global Production Settings
#################################################################
global:
  # Use image pull secrets for private registries
  imagePullSecrets:
    - name: ecr-registry-secret

#################################################################
# Keycloak Configuration - Cloud
#################################################################
backstage:
  replicaCount: 1

keycloak:
  enabled: true
  createNamespace: false
  namespace: null
  forceRender: true
  # Iron Bank images for Keycloak and its operator
  # For testing without registry1 auth, these public equivalents work:
  #   operator.image: quay.io/keycloak/keycloak-operator:26.1
  #   image: quay.io/keycloak/keycloak:26.1
  operator:
    image: "registry1.dso.mil/ironbank/opensource/keycloak/keycloak-operator:26.1"
    keycloakImage: "registry1.dso.mil/ironbank/opensource/keycloak/keycloak:26.1"
  image: "registry1.dso.mil/ironbank/opensource/keycloak/keycloak:26.1"
  http:
    httpEnabled: false
  ingress:
    enabled: false
  customIngress:
    enabled: false
  hostname:
    hostname: https://keycloak.placeholder.invalid:8443
    admin: https://keycloak.placeholder.invalid:8443
    strict: false
  admin:
    secret:
      name: keycloak-admin-secret
      create: false
  database:
    secret:
      name: keycloak-db-secret
      create: false
  postgres:
    # Iron Bank PostgreSQL image
    # For testing without registry1 auth: docker.io/postgres:16
    image:
      repository: registry1.dso.mil/ironbank/opensource/postgres/postgresql16
      tag: "16"
    initImage: registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.7
    storage:
      className: ebs-gp3
  realm:
    importResources:
      requests:
        memory: 1Gi
      limits:
        memory: 2Gi
    client:
      secret:
        name: keycloak-backstage-client-secret
        create: false
  tls:
    secret:
      name: keycloak-tls
      create: false

#################################################################
# Ingress NGINX - Iron Bank Image Override
#################################################################
# For testing without registry1 auth, comment out this section
# and the default registry.k8s.io image will be used.
ingress-nginx:
  controller:
    image:
      registry: registry1.dso.mil
      image: ironbank/opensource/kubernetes/ingress-nginx/controller
      tag: "v1.11.3"
      pullPolicy: Always
