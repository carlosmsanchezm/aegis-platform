# PKI overlay for local development
# Usage: helm upgrade -f values/local.yaml -f values/local-pki.yaml ...
#
# This overlay enables the internal PKI infrastructure:
# - cert-manager for automated certificate lifecycle management
# - step-ca as the internal Certificate Authority
# - step-issuer to integrate cert-manager with step-ca
#
# After deploying, services can use cert-manager Certificate resources
# with the "aegis-internal" StepClusterIssuer to get CA-signed certificates.

pki:
  enabled: true

  clusterIssuerName: aegis-internal
  trustBundleSecretName: aegis-trust-bundle
  trustBundleNamespaces:
    - aegis-system
    - keycloak

  # cert-manager configuration
  certManager:
    enabled: true
    installCRDs: true
    # Reduce resource usage for local dev
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # step-ca configuration
  stepCa:
    enabled: true
    ca:
      name: "Aegis Internal CA"
      provisioner:
        name: aegis
        type: JWK
      claims:
        minTLSCertDuration: 5m
        maxTLSCertDuration: 2160h
        defaultTLSCertDuration: 2160h
      db:
        persistent: false  # Use ephemeral storage for local dev
    service:
      type: ClusterIP
      port: 443
    bootstrap:
      enabled: true

  # step-issuer configuration
  stepIssuer:
    enabled: true

# When PKI is enabled, platform-api and proxy can use cert-manager for TLS
# Uncomment the following to enable cert-manager managed certificates:
#
# platformApi:
#   tls:
#     certManager:
#       enabled: true
#       issuerRef:
#         name: aegis-internal
#         kind: StepClusterIssuer
#         group: certmanager.step.sm
#
# proxy:
#   tls:
#     certManager:
#       enabled: true
#       issuerRef:
#         name: aegis-internal
#         kind: StepClusterIssuer
#         group: certmanager.step.sm
