# Local development values for aegis-services
# This configuration is optimized for local development environments
# such as minikube, kind, or Docker Desktop Kubernetes

# Enable bundled ingress controller for local development
ingressController:
  enabled: true

ingress-nginx:
  controller:
    extraArgs:
      publish-status-address: localhost
    ingressClassResource:
      name: ingress-nginx
      default: false
    ingressClass: ingress-nginx
    publishService:
      enabled: false  # Avoid conflict with publish-status-address for local clusters
    service:
      type: LoadBalancer
    metrics:
      enabled: false

#################################################################
# Backstage Configuration - Local
#################################################################
backstage:
  enabled: true
  replicaCount: 1
  image:
    repository: backstage
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 7007
  env:
    BACKEND_SECRET: "dev-secret"
    AUTH_SESSION_SECRET: "dev-session-secret"
    KEYCLOAK_BASE_URL: "https://keycloak.localtest.me"
    KEYCLOAK_REALM: "aegis"
  KEYCLOAK_CLIENT_ID: "backstage"
  KEYCLOAK_CLIENT_SECRET: "local-backstage-client-secret"
  KEYCLOAK_ISSUER: "https://keycloak.localtest.me/realms/aegis"
  KEYCLOAK_METADATA_URL: "https://keycloak.localtest.me/realms/aegis/.well-known/openid-configuration"
  caBundle:
    secretName: aegis-backstage-ca

#################################################################
# Platform API Configuration - Local
#################################################################
platformApi:
  enabled: true
  replicaCount: 1
  serviceAccountName: aegis-platform-api

  image:
    repository: 567751785679.dkr.ecr.us-east-1.amazonaws.com/aegis/platform-api
    tag: "8afb9e0-vscode-dynamic"
    pullPolicy: Always  # Always pull to get latest :dev tag

  service:
    type: ClusterIP
    grpcPort: 8081
    httpPort: 8080

  ingress:
    enabled: true
    className: "ingress-nginx"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: platform-api-grpc.localtest.me
        paths:
          - path: /
            pathType: Prefix
            service: grpc

  # Local development environment variables
  env:
    LOG_LEVEL: "debug"
    AEGIS_PROXY_BASE_URL: "http://proxy.localtest.me"
    AEGIS_PROXY_EXPECTED_AUDIENCE: "aegis-proxy"
    AEGIS_STORE_BACKEND: "memory"
    OIDC_ISSUER_URL: "https://keycloak.localtest.me/realms/aegis"
    OIDC_AUDIENCE: "backstage"
    REQUIRE_PHISHING_RESISTANT_MFA: "true"
    ALLOWED_PHISHING_RESISTANT_AMR: "hwk,webauthn,piv,piv-cac"

  tls:
    enabled: false

  # Local kubeconfig directory
  kubeConfigsDir: "/tmp/kubeconfigs"
  targetNamespace: "aegis-workloads-local"
  clusters:
    dev-local:
      inCluster: true

  securityContext: null
  containerSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: true


  # Resource constraints for local development
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

  # Disable health probes for local development (endpoints not implemented yet)
  livenessProbe: null
  readinessProbe: null
  volumeMounts:
    - name: kubeconfigs
      mountPath: /tmp/kubeconfigs
      readOnly: true
  volumes:
    - name: kubeconfigs
      secret:
        secretName: aegis-kubeconfigs

#################################################################
# Proxy Configuration - Local
#################################################################
proxy:
  enabled: true
  replicaCount: 1

  image:
    repository: carlosmsanchez/aegis-proxy
    tag: "latest"
    pullPolicy: Always  # Always pull to get latest :dev tag

  service:
    type: ClusterIP
    port: 8085

  ingress:
    enabled: true
    className: "ingress-nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: proxy.localtest.me
        paths:
          - path: /
            pathType: Prefix
            service: http

  # Local development JWT secret (32+ chars) - must match Platform API
  jwtSecret: "a-very-secret-key-for-local-dev-must-be-32-chars"
  expectedAudience: "aegis-proxy"
  allowedSuffix: ".svc.cluster.local"
  publicHost: "proxy.localtest.me"

  tls:
    enabled: false

  # Local development environment variables
  env:
    LOG_LEVEL: "debug"

  securityContext: null
  containerSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: true

  # Resource constraints for local development
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

  # Relaxed probes for local development
  livenessProbe:
    tcpSocket:
      port: 8085
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5

  readinessProbe:
    tcpSocket:
      port: 8085
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
