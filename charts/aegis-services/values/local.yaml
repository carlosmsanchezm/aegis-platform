  # Local kubeconfig directory
  kubeConfigsDir: "/tmp/kubeconfigs"
  targetNamespace: "aegis-workloads-local"
  clusters:
    dev-local:
      inCluster: true

  securityContext: null
  containerSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: true


  # Resource constraints for local development
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "200m"
      memory: "512Mi"

  # Disable health probes for local development (endpoints not implemented yet)
  livenessProbe: null
  readinessProbe: null
  volumeMounts:
    - name: kubeconfigs
      mountPath: /tmp/kubeconfigs
      readOnly: true
  volumes:
    - name: kubeconfigs
      secret:
        secretName: aegis-kubeconfigs

#################################################################
# Proxy Configuration - Local
#################################################################
proxy:
  enabled: true
  replicaCount: 1

  image:
    repository: carlosmsanchez/aegis-proxy
    tag: "latest"
    pullPolicy: Always  # Always pull to get latest :dev tag

  service:
    type: ClusterIP
    port: 8085

  ingress:
    enabled: true
    className: "ingress-nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: proxy.localtest.me
        paths:
          - path: /
            pathType: Prefix
            service: http

  # Local development JWT secret (32+ chars) - must match Platform API
  jwtSecret: "a-very-secret-key-for-local-dev-must-be-32-chars"
  expectedAudience: "aegis-proxy"
  allowedSuffix: ".svc.cluster.local"
  publicHost: "proxy.localtest.me"

  tls:
    enabled: false

  # Local development environment variables
  env:
    LOG_LEVEL: "debug"

  securityContext: null
  containerSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: true

  # Resource constraints for local development
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

  # Relaxed probes for local development
  livenessProbe:
    tcpSocket:
      port: 8085
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5

  readinessProbe:
    tcpSocket:
      port: 8085
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
