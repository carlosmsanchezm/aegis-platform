# Local development values for aegis-services
# This configuration is optimized for local development environments
# such as minikube, kind, or Docker Desktop Kubernetes

# Enable bundled ingress controller for local development
ingressController:
  enabled: true

ingress-nginx:
  controller:
    extraArgs:
      publish-status-address: localhost
    ingressClassResource:
      name: ingress-nginx
      default: false
    ingressClass: ingress-nginx
    publishService:
      enabled: false  # Avoid conflict with publish-status-address for local clusters
    service:
      type: LoadBalancer
    metrics:
      enabled: false

#################################################################
# Backstage Configuration - Local
#################################################################
backstage:
  enabled: false
  replicaCount: 1
  image:
    repository: carlosmsanchez/aegis-ui
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 7007
  ingress:
    enabled: false
  appConfig:
    appBaseUrl: "https://backstage.localtest.me"
    backendBaseUrl: "https://backstage.localtest.me"
  postgres:
    host: "platform-postgres.aegis-system.svc.cluster.local"
    port: "5432"
    user: "aegis_platform"
    existingSecret: "aegis-services-platform-api-secret"
    existingSecretPasswordKey: "db-password"
  keycloak:
    baseUrl: "https://keycloak.localtest.me"
    realm: "aegis"
    clientId: "backstage"
    jwksUrl: "https://aegis-services-keycloak.keycloak.svc.cluster.local:8443/realms/aegis/protocol/openid-connect/certs"
    clientSecret:
      secretName: "keycloak-backstage-client-secret"
      key: "clientSecret"
  secrets:
    create: true
    name: "aegis-backstage-secret"
    backendSecret: "dev-secret"
  caBundle:
    secretName: aegis-backstage-ca

#################################################################
# Platform API Configuration - Local
#################################################################
platformApi:
  enabled: true
  replicaCount: 1
  serviceAccountName: aegis-platform-api
  postgres:
    enabled: true
    waitForReady: true  # Wait for postgres to be ready before starting platform-api
    initChown: true
    initImage: registry.access.redhat.com/ubi9/ubi-minimal:9.3
    image:
      repository: docker.io/postgres
      tag: "16"
      pullPolicy: Always
    storage:
      size: 5Gi
      className: ""
  hostAliases:
  - ip: "10.96.146.219"
    hostnames:
    - "keycloak.localtest.me"

  image:
    repository: carlosmsanchez/aegis-platform-api
    tag: "dev"
    pullPolicy: IfNotPresent  # Use local kind-loaded image; cloud.yaml uses Always

  service:
    type: ClusterIP
    grpcPort: 8081
    httpPort: 8080

  ingress:
    enabled: true
    className: "ingress-nginx"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: platform-api-grpc.localtest.me
        paths:
          - path: /
            pathType: Prefix
            service: grpc

  # Local development environment variables
  env:
    # DEV MODE: Skip IAM role assumption, use credentials directly
    # WARNING: Do not enable in production - breaks multi-tenancy isolation
    AEGIS_DEV_MODE: "true"
    LOG_LEVEL: "debug"
    AEGIS_PROXY_BASE_URL: "http://proxy.localtest.me"
    AEGIS_PROXY_EXPECTED_AUDIENCE: "aegis-proxy"
    AEGIS_STORE_BACKEND: "postgres"
    # Enable automatic observability stack deployment on spoke clusters
    AEGIS_OBSERVABILITY_ENABLED: "true"
    # IMPORTANT: Issuer must match the "iss" claim in tokens.
    # Local Keycloak hostname is keycloak.localtest.me, so tokens carry that as "iss".
    OIDC_ISSUER_URL: "https://keycloak.localtest.me/realms/aegis"
    # Use the service name that matches the TLS cert SAN (without -service suffix)
    OIDC_JWKS_URL: "https://aegis-services-keycloak.keycloak.svc.cluster.local:8443/realms/aegis/protocol/openid-connect/certs"
    OIDC_AUDIENCE: "backstage,aegis-platform"
    REQUIRE_PHISHING_RESISTANT_MFA: "false"
    ALLOWED_PHISHING_RESISTANT_AMR: "hwk,webauthn,piv,piv-cac"
    AEGIS_AUTO_BOOTSTRAP_WORKSPACES: "true"
    AEGIS_INFRA_CONTROLLER: "true"
    AEGIS_INFRA_NAMESPACE: "aegis-system"
    AEGIS_KUBECONFIG_SECRET_NAME: "aegis-kubeconfigs"
    AEGIS_KUBECONFIG_SECRET_NAMESPACE: "aegis-system"
    # AWS NLB relay endpoints — auto-populated by terraform/dev-relay via
    # charts/aegis-services/values/local-relay.yaml overlay (do not hardcode here).
    AEGIS_PLATFORM_API_ENDPOINT: ""
    AEGIS_PLATFORM_API_CA_FILE: ""
    AEGIS_PLATFORM_API_GRPC_INSECURE: "true"
    AEGIS_SPOKE_VALUES_FILE: "/root/charts/aegis-spoke/values-aws-relay.yaml"
    # Spoke-proxy CA for signing certs (fallback when cert-manager not enabled)
    AEGIS_SPOKE_PROXY_CA_CERT: "/etc/spoke-proxy-ca/ca.crt"
    AEGIS_SPOKE_PROXY_CA_KEY: "/etc/spoke-proxy-ca/ca.key"
    # Spoke-proxy NLB configuration for stable proxy URL
    # Target group ARN for attaching EKS node groups to the NLB
    AEGIS_SPOKE_PROXY_TARGET_GROUP: ""
    # NLB hostname passed to k8s-agent for proxy URL registration
    # Empty — agent auto-discovers from LoadBalancer Service
    AEGIS_SPOKE_PROXY_HOST: ""
    # cert-manager + step-ca configuration for production-ready PKI
    # AEGIS_STEP_CA_URL is auto-populated by terraform/dev-relay overlay.
    AEGIS_CERT_MANAGER_ENABLED: "true"
    AEGIS_STEP_CA_URL: ""
    AEGIS_STEP_CA_ROOT_CA_FILE: "/etc/step-ca/root_ca.crt"
    AEGIS_STEP_PROVISIONER_NAME: "aegis"
    AEGIS_STEP_PROVISIONER_KID: "0T9QMX-qJc9L6ngJM3mP4UpCCUeufCH9dbLm-uxv4YI"
    AEGIS_STEP_PROVISIONER_PASSWORD_FILE: "/etc/step-ca/provisioner-password"
    AEGIS_CLUSTER_ISSUER_NAME: "aegis-internal"
    AUTHZ_ROLE_BINDINGS_JSON: |-
      [
        {
          "clients": ["backstage", "vscode-extension"],
          "roles": ["workspace-admin"],
          "projects": ["*"],
          "queues": ["*"]
        }
      ]
    PULUMI_BACKEND_URL: "s3://aegis-pulumi-state-195714074609/aegis/pulumi"
    PULUMI_CONFIG_PASSPHRASE: "aegis-local-passphrase"
    AEGIS_DEFAULT_AWS_ACCOUNT_ID: "195714074609"
    AEGIS_DEFAULT_AWS_ROLE_ARN: ""
    AEGIS_DEFAULT_AWS_EXTERNAL_ID: "na"
    AWS_REGION: "us-east-1"
    AWS_DEFAULT_REGION: "us-east-1"
    DB_HOST: "platform-postgres.aegis-system.svc.cluster.local"
    DB_PORT: "5432"
    DB_NAME: "aegis_platform"
    DB_USER: "aegis_platform"
    DB_SSLMODE: "disable"
    PG_MAX_OPEN_CONNS: "10"
    PG_MAX_IDLE_CONNS: "5"
    PG_CONN_MAX_LIFETIME: "30m"
  envFromSecret:
    AWS_ACCESS_KEY_ID: aws-access-key-id
    AWS_SECRET_ACCESS_KEY: aws-secret-access-key
    DB_PASSWORD: db-password
  secrets:
    aws-access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
    aws-secret-access-key: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
    AEGIS_DEFAULT_AWS_ACCOUNT_ID: "REPLACE_WITH_AWS_ACCOUNT_ID"
    AEGIS_DEFAULT_AWS_ROLE_ARN: "REPLACE_WITH_AWS_ROLE_ARN"
    AEGIS_DEFAULT_AWS_EXTERNAL_ID: "REPLACE_WITH_AWS_EXTERNAL_ID"
    db-password: "REPLACE_WITH_DB_PASSWORD"
    authz-role-bindings.json: |
      [
        {
          "clients": ["backstage", "vscode-extension"],
          "roles": ["workspace-admin"],
          "projects": ["*"],
          "queues": ["*"]
        }
      ]
  migrations:
    enabled: true
    image:
      repository: migrate/migrate
      tag: v4.16.2
      pullPolicy: IfNotPresent
    ttlSecondsAfterFinished: 300
    args:
      - "-path=/migrations"
      - "-database=$(DATABASE_URL)"
      - "up"
  tls:
    enabled: true
    serveGrpc: true
    # cert and key are managed by cert-manager when using the local-pki overlay
    # To use inline certs instead, provide PEM values here
    cert: ""
    key: ""
  auth:
    oidc:
      skipTlsVerify: false
      caBundle:
        create: true
        secretName: aegis-platform-api-oidc-ca
        key: ca.crt
        fileName: ca.crt
        mountPath: /etc/aegis-platform-api/oidc
        data: |
          -----BEGIN CERTIFICATE-----
          MIIFRTCCAy2gAwIBAgIUP9Er0SfYqpj3NK6WoqFwPYfEZ2kwDQYJKoZIhvcNAQEL
