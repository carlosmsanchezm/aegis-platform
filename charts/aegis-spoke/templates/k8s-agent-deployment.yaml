{{- include "aegis-spoke.validateProxyConfig" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-spoke.k8sAgent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-spoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-agent
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.k8sAgent.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis-spoke.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: k8s-agent
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "aegis-spoke.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: k8s-agent
    spec:
      {{- if ne (default "dev" .Values.hardeningProfile) "dev" }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      serviceAccountName: {{ .Values.rbac.serviceAccount.name }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "{{ .Values.k8sAgent.image.repository }}:{{ .Values.k8sAgent.image.tag }}"
          imagePullPolicy: {{ .Values.k8sAgent.image.pullPolicy }}
          command: ["/manager"]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          ports: []
          {{- if ne (default "dev" .Values.hardeningProfile) "dev" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            {{- if ne (default "dev" .Values.hardeningProfile) "dev" }}
            - name: GODEBUG
              value: "fips140=only"
            - name: AEGIS_FIPS_ENABLED
              value: "true"
            - name: AEGIS_TLS_MIN_VERSION
              value: "1.2"
            - name: AEGIS_TLS_CIPHER_SUITES
              value: "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
            {{- end }}
            {{- $env := .Values.k8sAgent.env | default dict -}}
            {{- $trust := .Values.k8sAgent.trustBundle | default dict -}}
            {{- range $k, $v := $env }}
            {{- if and (ne $k "AEGIS_PROXY_INGRESS_HOST") (ne $k "AEGIS_PROXY_URL") }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if and ($trust.enabled | default false) (not (hasKey $env "AEGIS_PLATFORM_CA_FILE")) }}
            - name: AEGIS_PLATFORM_CA_FILE
              value: {{ printf "%s/%s" ($trust.mountPath | default "/etc/aegis/trust") ($trust.fileName | default "ca.crt") | quote }}
            {{- end }}
            {{- if and ($trust.enabled | default false) (not (hasKey $env "AEGIS_CP_OIDC_CA_FILE")) }}
            - name: AEGIS_CP_OIDC_CA_FILE
              value: {{ printf "%s/%s" ($trust.mountPath | default "/etc/aegis/trust") ($trust.fileName | default "ca.crt") | quote }}
            {{- end }}
            {{- if .Values.proxy.ingress.hostname }}
            - name: AEGIS_PROXY_INGRESS_HOST
              value: {{ .Values.proxy.ingress.hostname | quote }}
            {{- end }}
            {{- if .Values.proxy.url }}
            - name: AEGIS_PROXY_URL
              value: {{ .Values.proxy.url | quote }}
            {{- end }}
          {{- if ($trust.enabled | default false) }}
          volumeMounts:
            - name: trust-bundle
              mountPath: {{ $trust.mountPath | default "/etc/aegis/trust" }}
              readOnly: true
          {{- end }}
      {{- if ($trust.enabled | default false) }}
      volumes:
        - name: trust-bundle
          secret:
            secretName: {{ $trust.secretName | default "aegis-trust-bundle" }}
            items:
              - key: {{ $trust.key | default "ca.crt" }}
                path: {{ $trust.fileName | default "ca.crt" }}
      {{- end }}
