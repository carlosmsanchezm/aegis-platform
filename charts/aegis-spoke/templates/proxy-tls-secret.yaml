{{- $tls := .Values.proxy.tls | default dict -}}
{{- $cm := $tls.certManager | default dict -}}
{{- if and .Values.proxy.enabled (not ($cm.enabled | default false)) $tls.cert $tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-spoke.proxy.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-spoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
type: kubernetes.io/tls
data:
  tls.crt: {{ $tls.cert | b64enc }}
  tls.key: {{ $tls.key | b64enc }}
{{- end }}
