{{- if and .Values.proxy.enabled .Values.proxy.tls.cert .Values.proxy.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-spoke.proxy.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-spoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.proxy.tls.cert | b64enc }}
  tls.key: {{ .Values.proxy.tls.key | b64enc }}
{{- end }}
