{{- range $name, $class := (.Values.workspaceClasses | default dict) }}
---
apiVersion: aegis.yourorg.dev/v1alpha2
kind: WorkspaceClass
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis-spoke.labels" $ | nindent 4 }}
    app.kubernetes.io/component: workspace-class
spec:
  {{- with $class.defaults }}
  defaults:
    {{- with .execution }}
    execution:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .storage }}
    storage:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .network }}
    network:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with $class.composition }}
  composition:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $class.admission }}
  admission:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
