replicaCount: 1

service:
  type: ClusterIP
  port: 443

serviceMonitor:
  enabled: true

args:
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP,Hostname,InternalDNS,ExternalDNS,ExternalIP

resources:
  requests:
    cpu: 75m
    memory: 120Mi
  limits:
    cpu: 200m
    memory: 200Mi

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
