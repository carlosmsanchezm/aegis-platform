fullnameOverride: aegis-logging-fluentbit

image:
  repository: fluent/fluent-bit
  pullPolicy: IfNotPresent

rbac:
  create: true
  nodeAccess: true
  eventsAccess: true

serviceAccount:
  automountServiceAccountToken: true

service:
  type: ClusterIP

env:
  - name: CLUSTER_ID
    value: local-cluster
  - name: LOKI_HOST
    value: aegis-logging-loki
  - name: LOKI_PORT
    value: "3100"

config:
  service: |-
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |-
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

    [INPUT]
        Name kubernetes_events
        Tag kube.events
        kube_url https://kubernetes.default.svc:443
        kube_ca_file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kube_token_file /var/run/secrets/kubernetes.io/serviceaccount/token
        tls.verify Off

  filters: |-
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off
        Kube_Tag_Prefix kube.var.log.containers.

    [FILTER]
        Name modify
        Match kube.*
        Add cluster_id ${CLUSTER_ID}

    [FILTER]
        Name modify
        Match kube.events
        Add cluster_id ${CLUSTER_ID}

  outputs: |-
    [OUTPUT]
        Name loki
        Match kube.*
        Host ${LOKI_HOST}
        Port ${LOKI_PORT}
        labels cluster=${CLUSTER_ID},namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name'],app=$kubernetes['labels']['app']
        label_keys $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name'],$kubernetes['labels']['app']
        remove_keys kubernetes,stream
        line_format json
        auto_kubernetes_labels off

    [OUTPUT]
        Name loki
        Match kube.events
        Host ${LOKI_HOST}
        Port ${LOKI_PORT}
        labels cluster=${CLUSTER_ID},namespace=$kubernetes['namespace_name'],event_reason=$reason,event_type=$type
        label_keys $kubernetes['namespace_name'],$reason,$type
        remove_keys kubernetes,stream
        line_format json
        auto_kubernetes_labels off

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 256Mi

testFramework:
  enabled: false
