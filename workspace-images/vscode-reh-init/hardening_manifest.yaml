  BASE_TAG: "9.7"

labels:
  org.opencontainers.image.title: "aegis-vscode-reh-init"
  org.opencontainers.image.description: "Init container providing pre-downloaded VS Code Remote Extension Host for Aegis workspace pods"
  org.opencontainers.image.licenses: "Proprietary"
